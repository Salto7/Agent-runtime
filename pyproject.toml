[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.1.0"
description = "A reusable objective-based agent runtime that plans, executes, recovers, and grows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-litellm>=0.1",
    "langgraph>=0.2",
    "litellm>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.json"]
