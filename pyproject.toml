[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.2.0"
description = "A reusable multi-agent runtime: CrewAI crews, LiteLLM, Docker sandbox, A2A, Cognee memory and dreaming — without Django."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "crewai[a2a]>=1.15",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "dramatiq[redis]>=1.17,<2.0",
    "redis>=5.0,<6.0",
    "docker>=7.1",
    "ptyprocess>=0.7",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "croniter>=6.0",
    "skills-ref>=0.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]   # only needed to run the MCP supervisor outside the sandbox image
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.json", "**/*.sh"]
